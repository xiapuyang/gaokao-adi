[project]
name = "gaokao-adi"
version = "3.16.0"
description = "中国高考志愿专业路径双功能工具：按成绩推荐专业 + ADI 综合分数测评（风灵之声 ADI 模型工程化复刻）"
readme = "README.md"
license = { text = "MIT" }
# 运行时零第三方依赖——只用标准库。
# requires-python 锁 3.10：代码使用 PEP 604 联合类型注解（`X | None`），3.9 会在 import 阶段 TypeError。
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
